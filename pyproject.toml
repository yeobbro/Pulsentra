# Tool configuration only. Dependencies live in requirements*.txt (ranges) and requirements-lock.txt (one tested set).
[project]
name = "pulsentra"
version = "0.4.0.dev0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: calls a real external API with credentials; skipped unless PULSENTRA_RUN_INTEGRATION=1 and the keys are set",
]
